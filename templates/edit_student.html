{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}

<div class="page-header">
    <a href="/students/{{ student_id }}" style="font-size:13px; color:#e94560; text-decoration:none;">
        ← Back to Student Profile
    </a>
    <h1 style="margin-top:8px;">Edit Student</h1>
    <p>Update {{ student['first_name'] }} {{ student['last_name'] }}'s information</p>
</div>

<div style="max-width: 600px;">
    <div class="card">
        <h2>Student Information</h2>

        {% if error %}
        <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="two-col">
                <div class="form-group">
                    <label for="student-first-name">First Name *</label>
                    <input id="student-first-name" type="text" name="fname" autocomplete="given-name" value="{{ student['first_name'] }}" required>
                </div>
                <div class="form-group">
                    <label for="student-last-name">Last Name *</label>
                    <input id="student-last-name" type="text" name="lname" autocomplete="family-name" value="{{ student['last_name'] }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="student-middle-name">Middle Name <span style="color:#bbb; font-weight:400;">(optional)</span></label>
                <input id="student-middle-name" type="text" name="mname" autocomplete="additional-name" value="{{ student['middle_name'] or '' }}">
            </div>

            <div class="form-group">
                <label for="student-date-of-birth">Date of Birth</label>
                <input id="student-date-of-birth" type="date" name="date_of_birth"
                       value="{{ student['date_of_birth'].strftime('%Y-%m-%d') if student['date_of_birth'] else '' }}">
            </div>

            <div class="form-group">
                <label for="student-email">Email Address *</label>
                <input id="student-email" type="email" name="email" autocomplete="email" value="{{ student['email'] }}" required>
            </div>

            <div class="form-group">
                <label for="student-address">Address <span style="color:#bbb; font-weight:400;">(optional)</span></label>
                <input id="student-address" type="text" name="address" autocomplete="street-address" value="{{ student['address'] or '' }}">
            </div>

            <div class="two-col">
                <div class="form-group">
                    <label for="guardian-name">Guardian Name <span style="color:#bbb; font-weight:400;">(optional)</span></label>
                    <input id="guardian-name" type="text" name="guardian_name" value="{{ student['guardian_name'] or '' }}">
                </div>
                <div class="form-group">
                    <label for="guardian-phone">Guardian Phone <span style="color:#bbb; font-weight:400;">(optional)</span></label>
                    <input id="guardian-phone" type="tel" name="guardian_phone" autocomplete="tel" value="{{ student['guardian_phone'] or '' }}">
                </div>
            </div>

            <div class="form-group">
                <label for="student-grade-level">Grade Level *</label>
                <select id="student-grade-level" name="grade_level" required>
                    <option value="9" {% if student['grade_level'] == 9 %}selected{% endif %}>Grade 9</option>
                    <option value="10" {% if student['grade_level'] == 10 %}selected{% endif %}>Grade 10</option>
                    <option value="11" {% if student['grade_level'] == 11 %}selected{% endif %}>Grade 11</option>
                    <option value="12" {% if student['grade_level'] == 12 %}selected{% endif %}>Grade 12</option>
                </select>
            </div>

            <div style="display:flex; gap:10px; margin-top:10px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/students/{{ student_id }}" class="btn" 
                   style="background:#f0f2f5; color:#555;">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
